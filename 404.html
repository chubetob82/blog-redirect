<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to www.bolivarjesus.com</title>
<meta name="robots" content="noindex, follow">
<script>
/* Forward the whole path, so every link ever shared for blog.bolivarjesus.com still lands:
   /KangarooPegRevisited2026/es/?lang=es arrives at the same path on www.

   GitHub Pages serves this file for any path the repository does not have, which is every path
   except the root. The root has index.html, and that one is deliberately different: the bare
   hostname is not a page anyone bookmarked, it is someone typing the name of the blog, so it
   goes to /blog/ rather than to the CV at /. */
(function () {
  var to = "https://www.bolivarjesus.com" + location.pathname + location.search + location.hash;
  location.replace(to);
})();
</script>
<!-- The script carries the path across. This refresh cannot: it is a static string, so with
     JavaScript off it lands on the site root and the link below is the way through. -->
<meta http-equiv="refresh" content="4;url=https://www.bolivarjesus.com/">
<style>
:root{color-scheme:light dark;--ground:#F5F4EF;--ink:#16232E;--muted:#6B7480;--acc:#1F5FAE}
@media (prefers-color-scheme:dark){:root{--ground:#111A22;--ink:#EEF1F4;--muted:#8E99A4;--acc:#5893DC}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.w{max-width:44ch;margin:0 auto;padding:22vh 24px}
h1{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:600;font-size:1.7rem;margin:0 0 10px;line-height:1.15}
p{color:var(--muted);margin:.5em 0}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="w">
  <h1>This has moved</h1>
  <p>Everything that was here now lives on <a href="https://www.bolivarjesus.com/">www.bolivarjesus.com</a>, at the same path.</p>
  <p>Taking you there now. If nothing happens, the <a href="https://www.bolivarjesus.com/blog/">writing is here</a>.</p>
</div>
</body>
</html>
