<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to www.bolivarjesus.com</title>
<link rel="canonical" href="https://www.bolivarjesus.com/blog/">
<meta name="robots" content="noindex, follow">
<script>
/* The root of blog.bolivarjesus.com, and only the root. Somebody arriving here typed the
   name of the blog, so send them to the blog rather than to the CV at the site root. Every
   other path is handled by 404.html, which carries the path across unchanged. */
(function () {
  location.replace("https://www.bolivarjesus.com/blog/" + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="2;url=https://www.bolivarjesus.com/blog/">
<style>
:root{color-scheme:light dark;--ground:#F5F4EF;--ink:#16232E;--muted:#6B7480;--acc:#1F5FAE}

body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.w{max-width:44ch;margin:0 auto;padding:22vh 24px}
h1{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:600;font-size:1.7rem;margin:0 0 10px;line-height:1.15}

a{color:var(--acc)}
</style>
</head>

<div class="w">
