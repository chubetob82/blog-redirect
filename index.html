<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to www.bolivarjesus.com</title>
<link rel="canonical" href="https://www.bolivarjesus.com/">
<meta name="robots" content="noindex, follow">
<script>
/* Forward the whole path, so every link ever shared for blog.bolivarjesus.com still lands.
   GitHub Pages serves 404.html for any path it does not have, which is every path here, so
   this one file covers the entire host. index.html is the same file, and exists only so that
   the bare hostname answers 200 rather than 404 while it redirects. */
(function () {
  var to = "https://www.bolivarjesus.com" + location.pathname + location.search + location.hash;
  location.replace(to);
})();
</script>
<meta http-equiv="refresh" content="2;url=https://www.bolivarjesus.com/">
<style>
:root{color-scheme:light dark;--ground:#F5F4EF;--ink:#16232E;--muted:#6B7480;--acc:#1F5FAE}
@media (prefers-color-scheme:dark){:root{--ground:#111A22;--ink:#EEF1F4;--muted:#8E99A4;--acc:#5893DC}}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.w{max-width:44ch;margin:0 auto;padding:22vh 24px}
h1{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:600;font-size:1.7rem;margin:0 0 10px;line-height:1.15}
p{color:var(--muted);margin:.5em 0}
a{color:var(--acc)}
</style>
</head>
<body>
<div class="w">
  <h1>This has moved</h1>
  <p>The writing now lives at <a href="https://www.bolivarjesus.com/blog/">www.bolivarjesus.com</a>, along with everything else.</p>
  <p>Taking you there now.</p>
</div>
</body>
</html>
